name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # make fetches tag perl-3.044 (scripts/fetch-upstream), the pinned
      # libc16 and libkitchen16 releases (scripts/fetch-libc16,
      # scripts/fetch-libkitchen16) and the Open Watcom snapshot they name;
      # the snapshot is cached per libc16 pin.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tools
          key: libc16-tools-ubuntu-24.04-${{ hashFiles('scripts/fetch-libc16') }}

      # Ubuntu 24.04's bison is 3.8.2, the version the parser is pinned
      # to; scripts/yacc-perl checks it, and the generated parser against
      # upstream/parser.sha256.
      - name: Install DOSBox-X, bison and patch
        run: |
          sudo apt-get update
          sudo apt-get install -y dosbox-x bison patch

      # The development build links Open Watcom's runtime and is never
      # published (docs/DESIGN.md, section 8), so it is not uploaded.
      - name: Build
        run: make

      # Smoke tests, then PERL.EXE installed on other drives and
      # directories (@INC, -e and TEMP, -P).
      - name: Test
        run: make test

      # Perl 3.044's own t/ suite; a script in tests/t-baseline.txt that
      # stops passing fails the build.
      - name: Test (t/ suite)
        run: make test-t

      # What the objects need from a runtime with Open Watcom's headers,
      # and recompiled against libc16's (docs/M3-RUNTIME-AUDIT.md).
      - name: Audit
        run: |
          make audit
          cat build/audit/report.txt
          cat build/audit/libc16/report.txt

  # The runtime build (M3.4): PERL.EXE linked with libc16 and
  # libkitchen16 instead of Open Watcom's runtime. A build failure, a
  # failed smoke or installation case, or a case in tests/rt-slow.txt
  # failing in any way but a timeout makes it fail.
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tools
          key: libc16-tools-ubuntu-24.04-${{ hashFiles('scripts/fetch-libc16') }}

      - name: Install DOSBox-X, bison and patch
        run: |
          sudo apt-get update
          sudo apt-get install -y dosbox-x bison patch

      - name: Build
        run: make rt

      # Smoke tests, with tests/rt-slow.txt's cases (libc16#30's slow
      # heap) allowed to time out, then the installation tests and
      # EXECLTST.EXE.
      - name: Test
        run: make test-rt
