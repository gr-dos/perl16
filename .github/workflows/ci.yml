name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # PERL.EXE as M3 builds it: libc16 and libkitchen16 instead of Open
  # Watcom's runtime, checked at the link (scripts/check-link). A build
  # failure or a failed smoke, installation or t/ case makes it fail.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # make fetches tag perl-3.044 (scripts/fetch-upstream), the pinned
      # libc16 and libkitchen16 releases (scripts/fetch-libc16,
      # scripts/fetch-libkitchen16) and the Open Watcom snapshot they name;
      # the snapshot is cached per libc16 pin.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tools
          key: libc16-tools-ubuntu-24.04-${{ hashFiles('scripts/fetch-libc16') }}

      # Ubuntu 24.04's bison is 3.8.2, the version the parser is pinned
      # to; scripts/yacc-perl checks it, and the generated parser against
      # upstream/parser.sha256.
      - name: Install DOSBox-X, bison and patch
        run: |
          sudo apt-get update
          sudo apt-get install -y dosbox-x bison patch

      # No binary is published before M4's release candidate, so none is
      # uploaded.
      - name: Build
        run: make

      # check-link's own test; smoke tests and the runtime build's own;
      # then PERL.EXE installed on other drives and directories (@INC,
      # -e and TEMP, -P, execl).
      - name: Test
        run: make test

      # Perl 3.044's own t/ suite; a script in tests/t-baseline.txt that
      # stops passing fails the build.
      - name: Test (t/ suite)
        run: make test-t

  # The development build (M2): Open Watcom's runtime, the reference the
  # runtime build is compared with. Never published (docs/DESIGN.md,
  # section 8).
  dev:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tools
          key: libc16-tools-ubuntu-24.04-${{ hashFiles('scripts/fetch-libc16') }}

      - name: Install DOSBox-X, bison and patch
        run: |
          sudo apt-get update
          sudo apt-get install -y dosbox-x bison patch

      - name: Build
        run: make dev

      - name: Test
        run: make test-dev

      - name: Test (t/ suite)
        run: make test-t-dev

      # What the objects need from a runtime with Open Watcom's headers,
      # and recompiled against libc16's (docs/M3-RUNTIME-AUDIT.md).
      - name: Audit
        run: |
          make audit
          cat build/audit/report.txt
          cat build/audit/libc16/report.txt
